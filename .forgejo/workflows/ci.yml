name: CI, Build & Distribution

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: write

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 1 — Rust Workspace: Tests & Release Binaries
  # ─────────────────────────────────────────────────────────────────────────────
  test:
    name: "Rust Workspace — Tests & Binaries"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Install System Dependencies (WebKit & ALSA)"
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libasound2-dev \
            libssl-dev \
            pkg-config \
            libxdo-dev

      - name: "Setup Rust Toolchain"
        run: |
          if ! command -v cargo >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --profile minimal
            echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          fi

      - name: "Cargo Check Workspace"
        run: cargo check --workspace

      - name: "Run Workspace Unit Tests"
        run: cargo test --workspace

      - name: "Compile Release Binaries (lacraia-core & lacraia-app)"
        run: |
          cargo build --release -p lacraia-core -p lacraia-app
          mkdir -p dist
          cp target/release/lacraia-core dist/lacraia-core-linux-x86_64
          cp target/release/lacraia-app dist/lacraia-app-linux-x86_64
          chmod +x dist/lacraia-core-linux-x86_64 dist/lacraia-app-linux-x86_64

      - name: "Upload Rust Binaries Artifact"
        uses: actions/upload-artifact@v4
        with:
          name: rust-binaries
          path: dist/*

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 2 — Android Ecosystem: Assemble La Craia App & Simbiótyka APKs
  # ─────────────────────────────────────────────────────────────────────────────
  build-apk:
    name: "Android — Build Production APKs (App & Simbiótyka)"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4

      - name: "Setup Java JDK (17)"
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends openjdk-17-jdk-headless

      - name: "Setup Android SDK"
        uses: https://github.com/android-actions/setup-android@v3

      - name: "Setup Gradle"
        uses: https://github.com/gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: "Verify Keystore for Production Signing"
        run: |
          if [ -f "$HOME/.android/in_twolp_release.keystore" ] && [ -f "$HOME/.android/in_twolp_release.properties" ]; then
            echo "✅ Keystore soberana oficial detectada em $HOME/.android/in_twolp_release.keystore"
          else
            echo "::warning::Keystore soberana não detectada, criando keystore de desenvolvimento temporária"
            mkdir -p ~/.android
            keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Release,O=LaCraia,C=BR" || true
          fi

      - name: "Test & Assemble Production APKs"
        run: |
          cd packages/lacraia-android
          gradle test
          gradle assembleRelease || gradle assembleDebug
          mkdir -p ../../dist
          # Copy lacraia-app.apk
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk ../../dist/lacraia-app.apk
          else
            cp app/build/outputs/apk/debug/app-debug.apk ../../dist/lacraia-app.apk
          fi
          # Copy simbiotyka.apk
          if [ -f simbiotyka/build/outputs/apk/release/simbiotyka-release.apk ]; then
            cp simbiotyka/build/outputs/apk/release/simbiotyka-release.apk ../../dist/simbiotyka.apk
          else
            cp simbiotyka/build/outputs/apk/debug/simbiotyka-debug.apk ../../dist/simbiotyka.apk
          fi
          ls -lh ../../dist/*.apk
          echo "Verificando assinaturas dos APKs:"
          for apk in ../../dist/*.apk; do
            apksigner verify --print-certs "$apk" || true
          done

      - name: "Upload Android APK Artifacts"
        uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: dist/*.apk

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 3 — Deploy Static Documentation Site (Cloudflare + Codeberg Pages)
  # ─────────────────────────────────────────────────────────────────────────────
  deploy-site:
    name: "Deploy Documentation Site (lacraia.2lp.in)"
    runs-on: ubuntu-latest
    needs: [test, build-apk]
    if: (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && github.event_name == 'push'
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Download Built Android APK Artifacts"
        uses: actions/download-artifact@v4
        with:
          name: android-apks
          path: apk-artifacts

      - name: "Integrate APKs & Generate Version Manifest for Obtainium"
        run: |
          mkdir -p site
          if [ -d apk-artifacts ]; then
            cp apk-artifacts/*.apk site/ 2>/dev/null || true
          fi

          VERSION="$(head -n 1 VERSION 2>/dev/null | tr -d ' \r\n' || echo '0.2.0')"
          GIT_HASH="$(git rev-parse --short HEAD 2>/dev/null || echo 'main')"
          PUBLISHED_AT="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"

          cat <<EOF > site/version.json
          {
            "version": "${VERSION}",
            "min_compatible_version": "0.1.0",
            "package_id": "in.twolp.lacraia.app",
            "apk_url": "https://lacraia.2lp.in/lacraia-app.apk",
            "release_notes": "Continuous build from commit ${GIT_HASH}.",
            "published_at": "${PUBLISHED_AT}",
            "apps": {
              "lacraia-app": {
                "package_id": "in.twolp.lacraia.app",
                "apk_url": "https://lacraia.2lp.in/lacraia-app.apk",
                "name": "La Craia App (Cockpit & Jukebox)"
              },
              "simbiotyka": {
                "package_id": "in.twolp.lacraia.simbiotyka",
                "apk_url": "https://lacraia.2lp.in/simbiotyka.apk",
                "name": "Simbiótyka (HUD de Letras Sincronizadas)"
              }
            }
          }
          EOF

          cat <<EOF > site/version-nightly.json
          {
            "version": "${VERSION}-nightly.${GIT_HASH}",
            "min_compatible_version": "0.1.0",
            "package_id": "in.twolp.lacraia.app",
            "apk_url": "https://lacraia.2lp.in/lacraia-app.apk",
            "release_notes": "Continuous rolling nightly build from commit ${GIT_HASH}.",
            "published_at": "${PUBLISHED_AT}"
          }
          EOF

          ls -lh site/*.apk site/*.json 2>/dev/null || true

      - name: "Deploy to Cloudflare Workers"
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::Cloudflare credentials (CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID) not configured in secrets. Skipping Cloudflare deployment."
          else
            echo "Publishing documentation site and APKs to lacraia.2lp.in via Cloudflare Workers..."
            npx wrangler deploy || echo "::warning::Cloudflare deployment failed, proceeding to Codeberg Pages fallback."
          fi

      - name: "Upload APKs to Cloudflare R2"
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            echo "Publishing APKs to Sovereign R2 Bucket (twolp-bucket / bucket.2lp.in)..."
            if [ -f site/lacraia.apk ]; then
              npx wrangler r2 object put "twolp-bucket/lacraia.apk" --file="site/lacraia.apk" --remote || true
            elif [ -f dist/lacraia-app.apk ]; then
              npx wrangler r2 object put "twolp-bucket/lacraia.apk" --file="dist/lacraia-app.apk" --remote || true
            fi
            if [ -f site/simbiotyka.apk ]; then
              npx wrangler r2 object put "twolp-bucket/simbiotyka.apk" --file="site/simbiotyka.apk" --remote || true
            elif [ -f dist/simbiotyka.apk ]; then
              npx wrangler r2 object put "twolp-bucket/simbiotyka.apk" --file="dist/simbiotyka.apk" --remote || true
            fi
          fi

      - name: "Trigger Pratilera Store Update"
        env:
          CODEBERG_TOKEN: ${{ secrets.CODEBERG_TOKEN }}
        run: |
          if [ -n "$CODEBERG_TOKEN" ]; then
            echo "-> Notificando a Pratilera (Banca) para atualizar o catálogo..."
            curl -s -X POST \
              -H "Authorization: token $CODEBERG_TOKEN" \
              -H "Content-Type: application/json" \
              "https://codeberg.org/api/v1/repos/lumenpink/banca/actions/workflows/ci.yml/dispatches" \
              -d '{"ref": "main"}' || true
          else
            echo "CODEBERG_TOKEN ausente, pulando disparo remoto da Pratilera."
          fi

      - name: "Deploy to Codeberg Pages (Redundancy Fallback)"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "actions-user"
          git config user.email "actions@codeberg.org"

          WORKTREE_DIR=$(mktemp -d)
          if git ls-remote --exit-code --heads origin pages >/dev/null 2>&1; then
            git fetch origin pages:pages
            git worktree add "$WORKTREE_DIR" pages
          else
            git worktree add --orphan -b pages "$WORKTREE_DIR"
          fi

          rm -rf "${WORKTREE_DIR:?}"/*
          cp -r site/* "$WORKTREE_DIR/"
          # Exclude large binary APKs from git branch history (hosted on Cloudflare & Codeberg Releases)
          rm -f "$WORKTREE_DIR"/*.apk

          cd "$WORKTREE_DIR"
          rm -f CNAME
          git add -A
          if git diff --staged --quiet; then
            echo "No documentation changes to deploy to Codeberg Pages."
          else
            git commit -m "docs(site): deploy documentation to Codeberg Pages [skip ci]"
            git push origin pages
            echo "Successfully deployed documentation to Codeberg Pages."
          fi
          cd - >/dev/null
          git worktree remove "$WORKTREE_DIR" --force || true

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 4 — Release & Nightly Rolling Distribution (Codeberg)
  # ─────────────────────────────────────────────────────────────────────────────
  release:
    name: "Publish Release / Nightly Distribution"
    runs-on: ubuntu-latest
    needs: [test, build-apk]
    if: (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && github.event_name == 'push'
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Download All Built Artifacts"
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: "Assemble Release Directory & Compute Checksums"
        run: |
          mkdir -p dist
          find artifacts -type f -exec cp {} dist/ \;
          cd dist
          chmod +x lacraia-core-linux-x86_64 lacraia-app-linux-x86_64 2>/dev/null || true

          # Create release tarball for Linux binaries
          VERSION="$(head -n 1 ../VERSION 2>/dev/null | tr -d ' \r\n' || echo '0.2.0')"
          tar -czf "lacraia-${VERSION}-linux-x86_64.tar.gz" lacraia-core-linux-x86_64 lacraia-app-linux-x86_64
          sha256sum * > checksums.sha256
          ls -lh

      # ── Nightly Rolling Release (Push to main) ──
      - name: "Delete Previous Nightly Tag & Release"
        if: github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          API_URL: ${{ github.api_url || 'https://codeberg.org/api/v1' }}
          REPO: ${{ github.repository }}
        run: |
          git push --delete origin nightly 2>/dev/null \
            && echo "Remote nightly tag deleted" \
            || echo "Remote nightly tag not found (initial run?)"

          REL_ID=$(curl -s -H "Authorization: token $GITHUB_TOKEN" \
            "$API_URL/repos/$REPO/releases/tags/nightly" | grep -o '"id":[0-9]*' | head -n 1 | cut -d: -f2 || true)
          if [ -n "$REL_ID" ]; then
            echo "Deleting previous nightly release ID: $REL_ID"
            curl -sf -X DELETE -H "Authorization: token $GITHUB_TOKEN" \
              "$API_URL/repos/$REPO/releases/$REL_ID" || echo "Warning: Failed to delete release $REL_ID"
          fi

      - name: "Create Annotated Nightly Tag"
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "actions-user"
          git config user.email "actions@codeberg.org"
          git tag -d nightly 2>/dev/null || true
          git tag -a nightly -m "Nightly build - $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          git push origin nightly

      - name: "Publish Nightly Release (Sovereign Banca Links, Zero Binaries in Git)"
        if: github.ref == 'refs/heads/main'
        uses: https://github.com/softprops/action-gh-release@v2
        with:
          tag_name: "nightly"
          name: "Nightly Build ($(git rev-parse --short HEAD))"
          prerelease: true
          body: |
            Automated rolling nightly build from branch `main` at commit `${{ github.sha }}`.

            ### Download Direto dos Pacotes Soberanos na Banca (`banca.2lp.in`)
            * 📱 **La Craia App (Cockpit & Jukebox APK):** [`lacraia-app.apk`](https://banca.2lp.in/downloads/lacraia/nightly-latest/lacraia-app.apk)
            * 👁️ **Simbiótyka (HUD de Letras Sincronizadas APK):** [`simbiotyka.apk`](https://banca.2lp.in/downloads/lacraia/nightly-latest/simbiotyka.apk)
            * 💻 **Desktop Linux (Cockpit Nativo):** [`lacraia-app-linux-x86_64`](https://banca.2lp.in/downloads/lacraia/nightly-latest/lacraia-app)
            * 🎛️ **Server Daemon (Core Engine):** [`lacraia-core-linux-x86_64`](https://banca.2lp.in/downloads/lacraia/nightly-latest/lacraia-core)
            * 📦 **Tarball Completo:** [`lacraia-nightly-linux-x86_64.tar.gz`](https://banca.2lp.in/downloads/lacraia/nightly-latest/lacraia-linux-x86_64.tar.gz)
            * 📜 **Manifesto Atômico:** [`index.json`](https://banca.2lp.in/downloads/lacraia/index.json)

      # ── Official Release (Tags v*) ──
      - name: "Extract Release Notes"
        if: startsWith(github.ref, 'refs/tags/v')
        id: notes
        run: |
          TAG="${{ github.ref_name }}"
          CLEAN_VER="${TAG#v}"
          TAG_SUBJECT=$(git tag -l --format="%(contents:subject)" "$TAG" 2>/dev/null || true)
          RELEASE_TITLE="$TAG"
          if echo "$TAG_SUBJECT" | grep -q ': '; then
            TITLE_PART=$(echo "$TAG_SUBJECT" | sed -E 's/^[^:]+: //')
            RELEASE_TITLE="$TAG - $TITLE_PART"
          fi
          echo "title=$RELEASE_TITLE" >> "$GITHUB_OUTPUT"

          NOTES=$(awk -v t1="$TAG" -v t2="$CLEAN_VER" '
            $0 ~ "^### \\[" t1 "\\]" || $0 ~ "^### \\[" t2 "\\]" { in_section = 1; next }
            in_section && ($0 ~ "^###? \\[" || $0 ~ "^## ") { in_section = 0 }
            in_section { print }
          ' CHANGELOG.md)

          if echo "$NOTES" | grep -q '^[[:space:]]*- '; then
            echo "$NOTES" > /tmp/release_notes.md
          else
            echo "- La Craia production release $TAG with pre-cached audio engine and Simbiótyka companion HUD." > /tmp/release_notes.md
          fi

      - name: "Publish Official Release (Sovereign Banca Links, Zero Binaries in Git)"
        if: startsWith(github.ref, 'refs/tags/v')
        uses: https://github.com/softprops/action-gh-release@v2
        with:
          tag_name: "${{ github.ref_name }}"
          name: "${{ steps.notes.outputs.title }}"
          body_path: /tmp/release_notes.md

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 5 — Build & Push Multi-Stage Atomic Docker Container
  # ─────────────────────────────────────────────────────────────────────────────
  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 5 — Sovereign Continuous Deployment on obizero (Zero Watchtower)
  # ─────────────────────────────────────────────────────────────────────────────
  build-and-deploy-docker:
    name: "Container — Build & Sovereign CD (obizero)"
    runs-on: ubuntu-latest
    needs: [test]
    if: (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && github.event_name == 'push'
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4

      - name: "Build local Docker Image"
        run: |
          OLD_IMAGE_ID=$(docker inspect --format='{{.Id}}' lumenpink/lacraia:latest 2>/dev/null || true)
          echo "OLD_IMAGE_ID=$OLD_IMAGE_ID" >> $GITHUB_ENV
          docker build -t lumenpink/lacraia:latest -f ./Dockerfile .

      - name: "Login to Docker Hub (Registry Backup)"
        if: env.DOCKER_PASSWORD != ''
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin

      - name: "Push Image to Docker Hub (Registry Backup)"
        if: env.DOCKER_PASSWORD != ''
        env:
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          docker push lumenpink/lacraia:latest

      - name: "Deploy Locally on obizero (Direct Socket)"
        run: |
          echo "-> Aplicando atualização local no runtime Docker do obizero..."
          docker compose -f /home/lumen/stacks/lacraia/compose.yaml up -d --no-build lacraia

      - name: "Active Healthcheck & Rollback Protocol"
        run: |
          echo "-> Sondando estabilidade do container lacraia (polling 15s)..."
          SUCCESS=0
          for i in $(seq 1 15); do
            STATUS=$(docker inspect --format='{{.State.Status}}' lacraia 2>/dev/null || echo "unknown")
            if [ "$STATUS" = "running" ]; then
              echo "  [PASS] Container lacraia saudável e ativo (tentativa $i/15)."
              SUCCESS=1
              break
            fi
            sleep 1
          done

          if [ $SUCCESS -ne 1 ]; then
            echo "✘ [FALHA] Container não estabilizou no prazo limite! Acionando Rollback..."
            if [ -n "$OLD_IMAGE_ID" ]; then
              docker tag "$OLD_IMAGE_ID" lumenpink/lacraia:latest
              docker compose -f /home/lumen/stacks/lacraia/compose.yaml up -d --no-build lacraia
              echo "✔ Rollback concluído para imagem anterior $OLD_IMAGE_ID."
            fi
            exit 1
          fi

      - name: "Prune Orphan Docker Layers"
        run: |
          docker image prune -f


name: CI & Documentation Deploy

on:
  push:
    branches: ["main", "develop"]
    tags: ["v*"]
  pull_request:
    branches: ["main", "develop"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 1 — Rust Workspace: Tests & Formatting
  # ─────────────────────────────────────────────────────────────────────────────
  rust-check:
    name: "Rust Workspace — Tests & Check"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout repository"
        uses: https://github.com/actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Setup Rust toolchain"
        uses: https://github.com/actions-rust-lang/setup-rust-toolchain@v1

      - name: "Check Cargo workspace"
        run: cargo check --workspace

      - name: "Run workspace tests"
        run: cargo test --workspace

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 2 — Deploy Static Documentation (Cloudflare Workers)
  # ─────────────────────────────────────────────────────────────────────────────
  deploy-docs:
    name: "Deploy Documentation Site (lacraia.2lp.in)"
    runs-on: ubuntu-latest
    needs: [rust-check]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: "Checkout repository"
        uses: https://github.com/actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Setup Node.js for Wrangler"
        uses: https://github.com/actions/setup-node@v4
        with:
          node-version: 20

      - name: "Deploy to Cloudflare Workers"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::Cloudflare credentials (CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID) not configured in secrets. Skipping Cloudflare deployment."
          else
            echo "Publishing documentation site to lacraia.2lp.in via Cloudflare Workers..."
            npx wrangler deploy
          fi

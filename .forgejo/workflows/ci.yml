name: "CI/CD & Sovereign Release to Banca"

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  test:
    name: "Checks, Tests & Quality Gates"
    runs-on: ubuntu-latest
    container:
      image: docker.io/lumenpink/gost-ci-cross:latest
    steps:
      - name: "Checkout repository"
        uses: https://github.com/actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Configure Sovereign Lumen Cargo Registry"
        run: |
          mkdir -p "$HOME/.cargo"
          printf '[registries.lumen]\nindex = "sparse+https://git.2lp.in/api/packages/lumen/cargo/"\n' > "$HOME/.cargo/config.toml"
          if [ -n "${{ secrets.LUMEN_REGISTRY_TOKEN }}" ]; then
            printf '[registries.lumen]\ntoken = "${{ secrets.LUMEN_REGISTRY_TOKEN }}"\n' > "$HOME/.cargo/credentials.toml"
          fi

      - name: "Format Check"
        run: cargo fmt -- --check

      - name: "Clippy Check (Zero Warnings)"
        run: cargo clippy --workspace -- -D warnings

      - name: "Run Workspace Unit Tests"
        run: cargo test --workspace

      - name: "Audit Sovereign CD Workflow"
        run: bash tests/audit_cd_workflow.sh

      - name: "CCCP Quality Audit"
        run: |
          if command -v cccp >/dev/null 2>&1; then
            cccp check --strict || true
          fi

  deploy-banca:
    name: "Build & Publish La Craia Multiarch to Banca"
    runs-on: ubuntu-latest
    needs: [test]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    container:
      image: docker.io/lumenpink/gost-ci-cross:latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GIT_2LP_TOKEN: ${{ secrets.GIT_2LP_TOKEN }}
    steps:
      - name: "Checkout repository"
        uses: https://github.com/actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Configure Sovereign Lumen Cargo Registry"
        run: |
          mkdir -p "$HOME/.cargo"
          printf '[registries.lumen]\nindex = "sparse+https://git.2lp.in/api/packages/lumen/cargo/"\n' > "$HOME/.cargo/config.toml"
          if [ -n "${{ secrets.LUMEN_REGISTRY_TOKEN }}" ]; then
            printf '[registries.lumen]\ntoken = "${{ secrets.LUMEN_REGISTRY_TOKEN }}"\n' > "$HOME/.cargo/credentials.toml"
          fi

      - name: "Determine Version & Release Metadata"
        id: meta
        run: |
          RAW_VER=$(cat VERSION 2>/dev/null || grep -m1 '^version =' Cargo.toml | cut -d '"' -f2)
          COMMIT_HASH=$(git rev-parse --short HEAD)
          DATE_TAG=$(date -u +%Y%m%d)

          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG_VER="${GITHUB_REF#refs/tags/v}"
            echo "is_stable=true" >> $GITHUB_OUTPUT
            echo "version=${TAG_VER}" >> $GITHUB_OUTPUT
            echo "channel=stable" >> $GITHUB_OUTPUT
          else
            NIGHTLY_VER="${RAW_VER}-dev.${DATE_TAG}.${COMMIT_HASH}"
            echo "is_stable=false" >> $GITHUB_OUTPUT
            echo "version=${NIGHTLY_VER}" >> $GITHUB_OUTPUT
            echo "channel=nightly" >> $GITHUB_OUTPUT
          fi
          echo "date=$(date -u +%Y-%m-%d)" >> $GITHUB_OUTPUT

      - name: "Compile La Craia Multiarch CLI Binaries"
        run: |
          export RUSTFLAGS="-C target-feature=+crt-static"
          echo "★ [1/3] Compilando x86_64-unknown-linux-musl (Linux AMD64)..."
          cargo zigbuild --release --target x86_64-unknown-linux-musl -p lacraia-core || \
            cargo build --release --target x86_64-unknown-linux-musl -p lacraia-core

          echo "★ [2/3] Compilando aarch64-unknown-linux-musl (Linux ARM64)..."
          cargo zigbuild --release --target aarch64-unknown-linux-musl -p lacraia-core || \
            cargo build --release --target aarch64-unknown-linux-musl -p lacraia-core

          echo "★ [3/3] Compilando x86_64-pc-windows-gnu (Windows AMD64)..."
          cargo zigbuild --release --target x86_64-pc-windows-gnu -p lacraia-core || \
            cargo build --release --target x86_64-pc-windows-gnu -p lacraia-core

      - name: "Package Artifacts & Generate Checksums"
        run: |
          VERSION="${{ steps.meta.outputs.version }}"
          mkdir -p dist/packages

          if [ -d target/x86_64-unknown-linux-musl/release ]; then
            tar -czf "dist/packages/lacraia-${VERSION}-linux-amd64.tar.gz" \
              -C target/x86_64-unknown-linux-musl/release lacraia-core \
              -C "$PWD" README.md LICENSE 2>/dev/null || \
            tar -czf "dist/packages/lacraia-${VERSION}-linux-amd64.tar.gz" \
              -C target/x86_64-unknown-linux-musl/release lacraia-core
          fi

          if [ -d target/aarch64-unknown-linux-musl/release ]; then
            tar -czf "dist/packages/lacraia-${VERSION}-linux-arm64.tar.gz" \
              -C target/aarch64-unknown-linux-musl/release lacraia-core \
              -C "$PWD" README.md LICENSE 2>/dev/null || \
            tar -czf "dist/packages/lacraia-${VERSION}-linux-arm64.tar.gz" \
              -C target/aarch64-unknown-linux-musl/release lacraia-core
          fi

          if [ -d target/x86_64-pc-windows-gnu/release ]; then
            cd target/x86_64-pc-windows-gnu/release
            zip -j "$GITHUB_WORKSPACE/dist/packages/lacraia-${VERSION}-windows-amd64.zip" \
              lacraia-core.exe "$GITHUB_WORKSPACE/README.md" "$GITHUB_WORKSPACE/LICENSE" 2>/dev/null || \
            zip -j "$GITHUB_WORKSPACE/dist/packages/lacraia-${VERSION}-windows-amd64.zip" lacraia-core.exe
            cd "$GITHUB_WORKSPACE"
          fi

          cd dist/packages
          sha256sum * > SHA256SUMS
          cd "$GITHUB_WORKSPACE"

      - name: "Upload Artifacts to Cloudflare R2"
        run: |
          VERSION="${{ steps.meta.outputs.version }}"
          CHANNEL="${{ steps.meta.outputs.channel }}"

          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "Aviso: CLOUDFLARE_API_TOKEN ausente. Pulando upload R2."
            exit 0
          fi

          echo "★ Publicando artefatos versionados no R2 (twolp-bucket)..."
          for pkg in dist/packages/*; do
            filename=$(basename "$pkg")
            npx wrangler r2 object put "twolp-bucket/downloads/lacraia/${CHANNEL}/${filename}" --file="$pkg" --remote
          done

          echo "★ Publicando binários unificados em latest..."
          if [ -f target/x86_64-unknown-linux-musl/release/lacraia-core ]; then
            npx wrangler r2 object put "twolp-bucket/downloads/lacraia/${CHANNEL}-latest/lacraia" --file=target/x86_64-unknown-linux-musl/release/lacraia-core --remote
            npx wrangler r2 object put "twolp-bucket/downloads/lacraia/${CHANNEL}-latest/lacraia-linux-amd64" --file=target/x86_64-unknown-linux-musl/release/lacraia-core --remote
          fi
          if [ -f target/aarch64-unknown-linux-musl/release/lacraia-core ]; then
            npx wrangler r2 object put "twolp-bucket/downloads/lacraia/${CHANNEL}-latest/lacraia-linux-arm64" --file=target/aarch64-unknown-linux-musl/release/lacraia-core --remote
          fi
          if [ -f target/x86_64-pc-windows-gnu/release/lacraia-core.exe ]; then
            npx wrangler r2 object put "twolp-bucket/downloads/lacraia/${CHANNEL}-latest/lacraia.exe" --file=target/x86_64-pc-windows-gnu/release/lacraia-core.exe --remote
          fi

      - name: "Update & Rotate Release Manifest in Banca Repo"
        run: |
          VERSION="${{ steps.meta.outputs.version }}"
          DATE="${{ steps.meta.outputs.date }}"
          CHANNEL="${{ steps.meta.outputs.channel }}"
          IS_STABLE="${{ steps.meta.outputs.is_stable }}"

          if [ -z "$GIT_2LP_TOKEN" ]; then
            echo "Aviso: GIT_2LP_TOKEN ausente. Pulando rotação na Banca."
            exit 0
          fi

          git config --global user.name "Lumen Pink (CI Bot)"
          git config --global user.email "bot@2lp.in"

          BANCA_DIR=$(mktemp -d)
          git clone "https://${GIT_2LP_TOKEN}@git.2lp.in/lumen/banca.git" "$BANCA_DIR"
          cd "$BANCA_DIR"

          INDEX_JSON="site/downloads/lacraia/index.json"
          if [ ! -f "$INDEX_JSON" ]; then
            echo "Erro: $INDEX_JSON não encontrado na Banca."
            exit 1
          fi

          SHA_LINUX_AMD64=$(sha256sum "$GITHUB_WORKSPACE/target/x86_64-unknown-linux-musl/release/lacraia-core" 2>/dev/null | awk '{print $1}' || echo "")
          SHA_LINUX_ARM64=$(sha256sum "$GITHUB_WORKSPACE/target/aarch64-unknown-linux-musl/release/lacraia-core" 2>/dev/null | awk '{print $1}' || echo "")
          SHA_WIN_AMD64=$(sha256sum "$GITHUB_WORKSPACE/target/x86_64-pc-windows-gnu/release/lacraia-core.exe" 2>/dev/null | awk '{print $1}' || echo "")

          ENTRY=$(jq -n \
            --arg ver "$VERSION" \
            --arg date "$DATE" \
            --arg sha_bin "$SHA_LINUX_AMD64" \
            --arg sha_l64 "$SHA_LINUX_AMD64" \
            --arg sha_a64 "$SHA_LINUX_ARM64" \
            --arg sha_w64 "$SHA_WIN_AMD64" \
            --arg channel "$CHANNEL" \
            '{
              version: $ver,
              date: $date,
              url: "https://banca.2lp.in/downloads/lacraia/\($channel)-latest/lacraia",
              sha256: $sha_bin,
              artifacts: {
                "linux-amd64": {
                  url: "https://banca.2lp.in/downloads/lacraia/\($channel)/lacraia-\($ver)-linux-amd64.tar.gz",
                  binary_url: "https://banca.2lp.in/downloads/lacraia/\($channel)-latest/lacraia-linux-amd64",
                  sha256: $sha_l64
                },
                "linux-arm64": {
                  url: "https://banca.2lp.in/downloads/lacraia/\($channel)/lacraia-\($ver)-linux-arm64.tar.gz",
                  binary_url: "https://banca.2lp.in/downloads/lacraia/\($channel)-latest/lacraia-linux-arm64",
                  sha256: $sha_a64
                },
                "windows-amd64": {
                  url: "https://banca.2lp.in/downloads/lacraia/\($channel)/lacraia-\($ver)-windows-amd64.zip",
                  binary_url: "https://banca.2lp.in/downloads/lacraia/\($channel)-latest/lacraia.exe",
                  sha256: $sha_w64
                }
              }
            }')

          if [ "$IS_STABLE" = "true" ]; then
            jq --arg ver "$VERSION" --argjson entry "$ENTRY" \
              '.stable_latest = $ver | .stables = ([$entry] + (.stables // []))' \
              "$INDEX_JSON" > "${INDEX_JSON}.tmp" && mv "${INDEX_JSON}.tmp" "$INDEX_JSON"
          else
            jq --arg ver "$VERSION" --argjson entry "$ENTRY" \
              '.nightly_latest = $ver | .nightlies = ([$entry] + (.nightlies // []))' \
              "$INDEX_JSON" > "${INDEX_JSON}.tmp" && mv "${INDEX_JSON}.tmp" "$INDEX_JSON"
          fi

          git add "$INDEX_JSON"
          if ! git diff --cached --quiet; then
            git commit -m "chore(downloads): rotate lacraia release to ${VERSION} (#53)"
            git push origin main
            echo "★ Manifestos da Banca atualizados e sincronizados com sucesso."
          else
            echo "Manifesto já se encontra atualizado na Banca."
          fi

  build-and-deploy-docker:
    name: "Container — Build & Sovereign CD (obizero)"
    runs-on: ubuntu-latest
    needs: [test]
    if: (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && github.event_name == 'push'
    steps:
      - name: "Checkout repository"
        uses: https://github.com/actions/checkout@v4

      - name: "Build local Docker Image"
        run: |
          OLD_IMAGE_ID=$(docker inspect --format='{{.Id}}' lumenpink/lacraia:latest 2>/dev/null || true)
          echo "OLD_IMAGE_ID=$OLD_IMAGE_ID" >> $GITHUB_ENV
          docker build -t lumenpink/lacraia:latest -f ./Dockerfile .

      - name: "Login to Docker Hub (Registry Backup)"
        if: env.DOCKER_PASSWORD != ''
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin

      - name: "Push Image to Docker Hub (Registry Backup)"
        if: env.DOCKER_PASSWORD != ''
        env:
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          docker push lumenpink/lacraia:latest

      - name: "Deploy Locally on obizero (Direct Socket)"
        run: |
          echo "-> Aplicando atualização local no runtime Docker do obizero..."
          docker compose -f /home/lumen/stacks/lacraia/compose.yaml up -d --no-build lacraia

      - name: "Active Healthcheck & Rollback Protocol"
        run: |
          echo "-> Sondando estabilidade do container lacraia (polling 15s)..."
          SUCCESS=0
          for i in $(seq 1 15); do
            STATUS=$(docker inspect --format='{{.State.Status}}' lacraia 2>/dev/null || echo "unknown")
            if [ "$STATUS" = "running" ]; then
              echo "  [PASS] Container lacraia saudável e ativo (tentativa $i/15)."
              SUCCESS=1
              break
            fi
            sleep 1
          done

          if [ $SUCCESS -ne 1 ]; then
            echo "✘ [FALHA] Container não estabilizou no prazo limite! Acionando Rollback..."
            if [ -n "$OLD_IMAGE_ID" ]; then
              docker tag "$OLD_IMAGE_ID" lumenpink/lacraia:latest
              docker compose -f /home/lumen/stacks/lacraia/compose.yaml up -d --no-build lacraia
              echo "✔ Rollback concluído para imagem anterior $OLD_IMAGE_ID."
            fi
            exit 1
          fi

      - name: "Prune Orphan Docker Layers"
        run: |
          docker image prune -f

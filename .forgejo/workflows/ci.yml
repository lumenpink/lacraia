name: "CI/CD & Sovereign Release to Banca"

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: "Checks, Tests & Quality Gates"
    runs-on: ubuntu-latest
    container:
      image: gambi.2lp.in/lumen/gost-ci-cross:latest
    steps:
      - name: "Checkout repository"
        uses: https://github.com/actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Configure Sovereign Gambi Cargo Registry"
        run: |
          mkdir -p "$HOME/.cargo"
          printf '[registries.gambi]\nindex = "sparse+https://gambi.2lp.in/api/packages/lumen/cargo/"\n' > "$HOME/.cargo/config.toml"
          if [ -n "${{ secrets.LUMEN_REGISTRY_TOKEN }}" ]; then
            printf '[registries.gambi]\ntoken = "${{ secrets.LUMEN_REGISTRY_TOKEN }}"\n' > "$HOME/.cargo/credentials.toml"
          fi

      - name: "Format Check"
        run: cargo fmt -- --check

      - name: "Clippy Check (Zero Warnings)"
        run: cargo clippy --workspace -- -D warnings

      - name: "Run Workspace Unit Tests"
        run: cargo test --workspace

      - name: "Audit Sovereign CD Workflow"
        run: bash tests/audit_cd_workflow.sh

      - name: "CCCP Quality Audit"
        run: |
          if command -v cccp >/dev/null 2>&1; then
            cccp check --strict || true
          fi

  deploy-banca:
    name: "Build & Publish La Craia Multiarch to Banca"
    runs-on: ubuntu-latest
    needs: [test]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    container:
      image: gambi.2lp.in/lumen/gost-ci-cross:latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GIT_2LP_TOKEN: ${{ secrets.GIT_2LP_TOKEN }}
    steps:
      - name: "Checkout repository"
        uses: https://github.com/actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Configure Sovereign Gambi Cargo Registry"
        run: |
          mkdir -p "$HOME/.cargo"
          printf '[registries.gambi]\nindex = "sparse+https://gambi.2lp.in/api/packages/lumen/cargo/"\n' > "$HOME/.cargo/config.toml"
          if [ -n "${{ secrets.LUMEN_REGISTRY_TOKEN }}" ]; then
            printf '[registries.gambi]\ntoken = "${{ secrets.LUMEN_REGISTRY_TOKEN }}"\n' > "$HOME/.cargo/credentials.toml"
          fi

      - name: "Determine Version & Release Metadata"
        id: meta
        run: |
          RAW_VER=$(cat VERSION 2>/dev/null || grep -m1 '^version =' Cargo.toml | cut -d '"' -f2)
          COMMIT_HASH=$(git rev-parse --short HEAD)
          DATE_TAG=$(date -u +%Y%m%d)

          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG_VER="${GITHUB_REF#refs/tags/v}"
            echo "is_stable=true" >> $GITHUB_OUTPUT
            echo "version=${TAG_VER}" >> $GITHUB_OUTPUT
            echo "channel=stable" >> $GITHUB_OUTPUT
          else
            NIGHTLY_VER="${RAW_VER}-dev.${DATE_TAG}.${COMMIT_HASH}"
            echo "is_stable=false" >> $GITHUB_OUTPUT
            echo "version=${NIGHTLY_VER}" >> $GITHUB_OUTPUT
            echo "channel=nightly" >> $GITHUB_OUTPUT
          fi
          echo "date=$(date -u +%Y-%m-%d)" >> $GITHUB_OUTPUT

      - name: "Compile La Craia Multiarch CLI Binaries"
        run: |
          echo "★ [1/3] Compilando x86_64-unknown-linux-musl (Linux AMD64)..."
          RUSTFLAGS="-C target-feature=+crt-static" cargo zigbuild --release --target x86_64-unknown-linux-musl -p lacraia-core || \
            RUSTFLAGS="-C target-feature=+crt-static" cargo build --release --target x86_64-unknown-linux-musl -p lacraia-core

          echo "★ [2/3] Compilando aarch64-unknown-linux-musl (Linux ARM64)..."
          RUSTFLAGS="-C target-feature=+crt-static" cargo zigbuild --release --target aarch64-unknown-linux-musl -p lacraia-core || \
            RUSTFLAGS="-C target-feature=+crt-static" cargo build --release --target aarch64-unknown-linux-musl -p lacraia-core

          echo "★ [3/3] Compilando x86_64-pc-windows-gnu (Windows AMD64)..."
          ar cr /usr/x86_64-w64-mingw32/lib/libc.a 2>/dev/null || true
          cargo zigbuild --release --target x86_64-pc-windows-gnu -p lacraia-core || \
            cargo build --release --target x86_64-pc-windows-gnu -p lacraia-core

      - name: "Package Artifacts & Generate Checksums"
        run: |
          VERSION="${{ steps.meta.outputs.version }}"
          mkdir -p dist/packages

          if [ -d target/x86_64-unknown-linux-musl/release ]; then
            tar -czf "dist/packages/lacraia-${VERSION}-linux-amd64.tar.gz" \
              -C target/x86_64-unknown-linux-musl/release lacraia-core \
              -C "$PWD" README.md LICENSE 2>/dev/null || \
            tar -czf "dist/packages/lacraia-${VERSION}-linux-amd64.tar.gz" \
              -C target/x86_64-unknown-linux-musl/release lacraia-core
          fi

          if [ -d target/aarch64-unknown-linux-musl/release ]; then
            tar -czf "dist/packages/lacraia-${VERSION}-linux-arm64.tar.gz" \
              -C target/aarch64-unknown-linux-musl/release lacraia-core \
              -C "$PWD" README.md LICENSE 2>/dev/null || \
            tar -czf "dist/packages/lacraia-${VERSION}-linux-arm64.tar.gz" \
              -C target/aarch64-unknown-linux-musl/release lacraia-core
          fi

          if [ -d target/x86_64-pc-windows-gnu/release ]; then
            cd target/x86_64-pc-windows-gnu/release
            zip -j "$GITHUB_WORKSPACE/dist/packages/lacraia-${VERSION}-windows-amd64.zip" \
              lacraia-core.exe "$GITHUB_WORKSPACE/README.md" "$GITHUB_WORKSPACE/LICENSE" 2>/dev/null || \
            zip -j "$GITHUB_WORKSPACE/dist/packages/lacraia-${VERSION}-windows-amd64.zip" lacraia-core.exe
            cd "$GITHUB_WORKSPACE"
          fi

          cd dist/packages
          sha256sum * > SHA256SUMS
          cd "$GITHUB_WORKSPACE"

      - name: "Upload Artifacts to Cloudflare R2"
        run: |
          VERSION="${{ steps.meta.outputs.version }}"
          CHANNEL="${{ steps.meta.outputs.channel }}"

          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "Aviso: CLOUDFLARE_API_TOKEN ausente. Pulando upload R2."
            exit 0
          fi

          upload_r2_with_retry() {
            local target="$1"
            local file="$2"
            local max_attempts=4
            local attempt=1
            local delay=5

            while [ "$attempt" -le "$max_attempts" ]; do
              echo "  -> Enviando $file para $target (tentativa $attempt/$max_attempts)..."
              if npx wrangler r2 object put "$target" --file="$file" --remote; then
                echo "  ✓ Upload concluído com sucesso: $target"
                return 0
              fi
              echo "  ⚠️ Falha transitória ao enviar para o R2 (tentativa $attempt/$max_attempts). Aguardando ${delay}s..."
              sleep "$delay"
              attempt=$((attempt + 1))
              delay=$((delay * 2))
            done

            echo "❌ ERRO CRÍTICO: Falha permanente após $max_attempts tentativas ao publicar no Cloudflare R2: $target"
            exit 1
          }

          echo "★ Publicando artefatos versionados no R2 (twolp-bucket)..."
          for pkg in dist/packages/*; do
            [ -f "$pkg" ] || continue
            filename=$(basename "$pkg")
            upload_r2_with_retry "twolp-bucket/downloads/lacraia/${CHANNEL}/${filename}" "$pkg"
          done

          echo "★ Publicando binários unificados em latest..."
          if [ -f target/x86_64-unknown-linux-musl/release/lacraia-core ]; then
            upload_r2_with_retry "twolp-bucket/downloads/lacraia/${CHANNEL}-latest/lacraia" target/x86_64-unknown-linux-musl/release/lacraia-core
            upload_r2_with_retry "twolp-bucket/downloads/lacraia/${CHANNEL}-latest/lacraia-linux-amd64" target/x86_64-unknown-linux-musl/release/lacraia-core
          fi
          if [ -f target/aarch64-unknown-linux-musl/release/lacraia-core ]; then
            upload_r2_with_retry "twolp-bucket/downloads/lacraia/${CHANNEL}-latest/lacraia-linux-arm64" target/aarch64-unknown-linux-musl/release/lacraia-core
          fi
          if [ -f target/x86_64-pc-windows-gnu/release/lacraia-core.exe ]; then
            upload_r2_with_retry "twolp-bucket/downloads/lacraia/${CHANNEL}-latest/lacraia.exe" target/x86_64-pc-windows-gnu/release/lacraia-core.exe
          fi

      - name: "Update & Rotate Release Manifest in Banca Repo"
        run: |
          VERSION="${{ steps.meta.outputs.version }}"
          CHANNEL="${{ steps.meta.outputs.channel }}"

          if [ -z "$GIT_2LP_TOKEN" ]; then
            echo "Aviso: GIT_2LP_TOKEN ausente. Pulando rotação na Banca."
            exit 0
          fi

          git clone --depth 1 "https://lumen:${GIT_2LP_TOKEN}@gambi.2lp.in/lumen/banca.git" /tmp/banca

          if [ -d "/tmp/banca/site/downloads/lacraia" ] && [ -f "/tmp/banca/scripts/rotate-downloads.py" ]; then
            cd /tmp/banca

            for ARCH in "linux-amd64" "linux-arm64" "windows-amd64"; do
              EXT="tar.gz"
              [ "$ARCH" = "windows-amd64" ] && EXT="zip"
              PKG_FILE="lacraia-${VERSION}-${ARCH}.${EXT}"
              HASH=$(sha256sum "$GITHUB_WORKSPACE/dist/packages/$PKG_FILE" 2>/dev/null | awk '{print $1}' || echo "")
              DOWNLOAD_URL="https://banca.2lp.in/downloads/lacraia/${CHANNEL}/${PKG_FILE}"

              python3 scripts/rotate-downloads.py \
                --manifest site/downloads/lacraia/index.json \
                --channel "${CHANNEL}" \
                --arch "${ARCH}" \
                --version-str "${VERSION}" \
                --url "${DOWNLOAD_URL}" \
                --sha256 "${HASH}" \
                --tarball "${PKG_FILE}" \
                --app "lacraia"
            done

            git config user.name "Lacraia Release Bot"
            git config user.email "bot@2lp.in"
            git add site/downloads/lacraia/index.json
            if ! git diff --staged --quiet; then
              git commit -m "chore(downloads): rotate lacraia release to ${VERSION} (#55)"
              for attempt in 1 2 3 4 5; do
                if git push origin main; then
                  echo "✓ Manifesto da Banca atualizado com sucesso."
                  break
                fi
                echo "⚠️ Falha ao empurrar manifesto para Banca (tentativa $attempt/5). Reexecutando pull --rebase..."
                git pull --rebase origin main || true
                sleep 3
                if [ "$attempt" -eq 5 ]; then
                  echo "❌ ERRO CRÍTICO: Não foi possível empurrar manifesto para Banca após 5 tentativas."
                  exit 1
                fi
              done
            else
              echo "Manifesto já se encontra atualizado na Banca."
            fi
            cd "$GITHUB_WORKSPACE"
          fi

  deploy-apk:
    name: "Build Android APKs & Publish to Pratilera"
    runs-on: ubuntu-latest
    needs: [test]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    container:
      image: gambi.2lp.in/lumen/gost-ci-android:latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GAMBI_2LP_IN_TOKEN: ${{ secrets.GAMBI_2LP_IN_TOKEN }}
    steps:
      - name: "Checkout repository"
        uses: https://github.com/actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Determine Version & Channel"
        id: meta
        run: |
          RAW_VER=$(cat VERSION 2>/dev/null || echo "0.2.0")
          echo "version=${RAW_VER}" >> $GITHUB_OUTPUT
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "channel=stable" >> $GITHUB_OUTPUT
          else
            echo "channel=nightly" >> $GITHUB_OUTPUT
          fi

      - name: "Build Android APKs (Release)"
        run: |
          cd packages/lacraia-android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: "Collect & Sign APKs"
        run: |
          mkdir -p dist site
          cp packages/lacraia-android/app/build/outputs/apk/release/app-release.apk dist/lacraia.apk
          cp packages/lacraia-android/simbiotyka/build/outputs/apk/release/simbiotyka-release.apk dist/simbiotyka.apk

          if [ -x scripts/sign-release.sh ] && [ -f /root/.android/in_twolp_release.keystore ]; then
            bash scripts/sign-release.sh dist/lacraia.apk || true
            bash scripts/sign-release.sh dist/simbiotyka.apk || true
          fi

          # Espelho para compatibilidade
          cp dist/lacraia.apk dist/lacraia-app.apk
          cp dist/lacraia.apk site/lacraia.apk
          cp dist/lacraia.apk site/lacraia-app.apk
          cp dist/simbiotyka.apk site/simbiotyka.apk

          cat <<EOF > site/version.json
          {
            "version": "${{ steps.meta.outputs.version }}",
            "package_id": "in.twolp.lacraia.app",
            "apk_url": "https://lacraia.2lp.in/lacraia.apk",
            "apps": {
              "lacraia-app": {
                "apk_url": "https://lacraia.2lp.in/lacraia.apk"
              },
              "simbiotyka": {
                "apk_url": "https://lacraia.2lp.in/simbiotyka.apk"
              }
            }
          }
          EOF

      - name: "Upload APKs to Cloudflare R2"
        run: |
          upload_r2_with_retry() {
            local target="$1"
            local file="$2"
            local max_attempts=4
            local attempt=1
            local delay=5
            while [ "$attempt" -le "$max_attempts" ]; do
              echo "  -> Enviando $file para $target (tentativa $attempt/$max_attempts)..."
              if npx wrangler r2 object put "$target" --file="$file" --remote; then
                echo "  ✓ Upload concluído com sucesso: $target"
                return 0
              fi
              echo "  ⚠️ Falha transitória ao enviar para o R2 (tentativa $attempt/$max_attempts). Aguardando ${delay}s..."
              sleep "$delay"
              attempt=$((attempt + 1))
              delay=$((delay * 2))
            done
            echo "❌ ERRO CRÍTICO: Falha permanente após $max_attempts tentativas ao publicar no Cloudflare R2: $target"
            exit 1
          }

          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            echo "★ Publicando APKs canônicos na raiz do bucket para A Pratilera..."
            upload_r2_with_retry "twolp-bucket/lacraia.apk" dist/lacraia.apk
            upload_r2_with_retry "twolp-bucket/lacraia-app.apk" dist/lacraia.apk
            upload_r2_with_retry "twolp-bucket/simbiotyka.apk" dist/simbiotyka.apk

            echo "★ Publicando APKs versionados por canal..."
            upload_r2_with_retry "twolp-bucket/downloads/lacraia/${{ steps.meta.outputs.channel }}/lacraia.apk" dist/lacraia.apk
            upload_r2_with_retry "twolp-bucket/downloads/lacraia/${{ steps.meta.outputs.channel }}/simbiotyka.apk" dist/simbiotyka.apk

            if [ -f site/version.json ]; then
              upload_r2_with_retry "twolp-bucket/downloads/lacraia/version.json" site/version.json
            fi
          else
            echo "Aviso: CLOUDFLARE_API_TOKEN ausente. Pulando upload R2."
          fi

  trigger-pratilera:
    name: "Trigger Pratilera Store Update in Banca"
    runs-on: ubuntu-latest
    needs: [deploy-apk]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: "Trigger Pratilera Store Update"
        env:
          GAMBI_2LP_IN_TOKEN: ${{ secrets.GAMBI_2LP_IN_TOKEN }}
        run: |
          if [ -n "$GAMBI_2LP_IN_TOKEN" ]; then
            echo "-> Notificando a Pratilera (Banca) para atualizar o catálogo..."
            curl -s -X POST \
              -H "Authorization: token $GAMBI_2LP_IN_TOKEN" \
              -H "Content-Type: application/json" \
              "https://gambi.2lp.in/api/v1/repos/lumen/banca/actions/workflows/ci.yml/dispatches" \
              -d '{"ref": "main"}' || true
          else
            echo "GAMBI_2LP_IN_TOKEN ausente, pulando disparo remoto da Pratilera."
          fi

  build-and-deploy-docker:
    name: "Container — Build & Sovereign CD (obizero)"
    runs-on: ubuntu-latest
    needs: [test]
    if: (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && github.event_name == 'push'
    steps:
      - name: "Checkout repository"
        uses: https://github.com/actions/checkout@v4

      - name: "Build local Docker Image"
        run: |
          OLD_IMAGE_ID=$(docker inspect --format='{{.Id}}' gambi.2lp.in/lumen/lacraia:latest 2>/dev/null || true)
          echo "OLD_IMAGE_ID=$OLD_IMAGE_ID" >> $GITHUB_ENV
          docker build -t gambi.2lp.in/lumen/lacraia:latest -t lumenpink/lacraia:latest -f ./Dockerfile .

      - name: "Push Image to Sovereign Gambi Registry"
        if: env.GAMBI_TOKEN != ''
        env:
          GAMBI_TOKEN: ${{ secrets.GAMBI_2LP_IN_TOKEN }}
        run: |
          echo "$GAMBI_TOKEN" | docker login -u lumen --password-stdin gambi.2lp.in
          docker push gambi.2lp.in/lumen/lacraia:latest

      - name: "Sovereign CD on obizero via SSH"
        env:
          OBIZERO_SSH_HOST: ${{ secrets.OBIZERO_SSH_HOST }}
          OBIZERO_SSH_USER: ${{ secrets.OBIZERO_SSH_USER }}
          OBIZERO_SSH_KEY: ${{ secrets.OBIZERO_SSH_KEY }}
        run: |
          SSH_HOST="${OBIZERO_SSH_HOST:-172.17.0.1}"
          SSH_USER="${OBIZERO_SSH_USER:-lumen}"
          echo "-> Iniciando deploy soberano no nó obizero ($SSH_HOST)..."

          if [ -f ~/.ssh/id_obitwo ]; then
            SSH_OPTS="-i ~/.ssh/id_obitwo -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15"
          elif [ -f ~/.ssh/id_ed25519 ]; then
            SSH_OPTS="-i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15"
          elif [ -n "$OBIZERO_SSH_KEY" ]; then
            mkdir -p ~/.ssh && chmod 700 ~/.ssh
            echo "$OBIZERO_SSH_KEY" > /tmp/id_ci_obizero
            chmod 600 /tmp/id_ci_obizero
            SSH_OPTS="-i /tmp/id_ci_obizero -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15"
          else
            SSH_OPTS="-o StrictHostKeyChecking=accept-new -o ConnectTimeout=15"
          fi

          ssh $SSH_OPTS "$SSH_USER@$SSH_HOST" "
            set -eo pipefail
            cd ~/stacks/lacraia
            OLD_IMAGE_ID=\$(docker inspect --format='{{.Id}}' gambi.2lp.in/lumen/lacraia:latest 2>/dev/null || true)
            echo \"OLD_IMAGE_ID=\$OLD_IMAGE_ID\"

            echo '-> Aplicando atualizacao no container lacraia...'
            docker compose -f compose.yaml up -d --no-build lacraia

            echo '-> Sondando estabilidade do container lacraia (polling 15s)...'
            SUCCESS=0
            for i in \$(seq 1 15); do
              STATUS=\$(docker inspect --format='{{.State.Status}}' lacraia 2>/dev/null || echo 'unknown')
              if [ \"\$STATUS\" = 'running' ]; then
                echo \"  [PASS] Container lacraia saudavel e ativo (tentativa \$i/15).\"
                SUCCESS=1
                break
              fi
              sleep 1
            done

            if [ \$SUCCESS -ne 1 ]; then
              echo '✘ [FALHA] Container nao estabilizou no prazo limite! Acionando Rollback...'
              if [ -n \"\$OLD_IMAGE_ID\" ]; then
                docker tag \"\$OLD_IMAGE_ID\" gambi.2lp.in/lumen/lacraia:latest
                docker compose -f compose.yaml up -d --no-build lacraia
                echo \"✔ Rollback concluido para imagem anterior \$OLD_IMAGE_ID.\"
              fi
              exit 1
            fi

            echo '-> Limpando camadas orfas...'
            docker image prune -f
          "

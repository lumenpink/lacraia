name: Exhaustive E2E & Stress Suite

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 0' # Weekly run on Sunday at 03:00 UTC
  push:
    tags: ["v*"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-exhaustive:
    name: "Playwright Exhaustive & Soak Stress Suite"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout repository"
        uses: https://github.com/actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Setup Rust Toolchain"
        run: |
          rustup default stable
          rustup update stable

      - name: "Compile lacraia-core binary"
        run: cargo build -p lacraia-core --bin lacraia-core

      - name: "Setup Node.js (20)"
        uses: https://github.com/actions/setup-node@v4
        with:
          node-version: 20

      - name: "Install Playwright & Chrome Dependencies"
        run: |
          cd tests/e2e
          npm ci || npm install
          npx playwright install --with-deps chromium

      - name: "Run Exhaustive E2E Suite"
        run: |
          cd tests/e2e
          npm run test:exhaustive

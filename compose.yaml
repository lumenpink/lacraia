# ==============================================================================
# 🦂 La Craia — Especificação Canônica Docker Compose (compose.yaml)
# Conformidade com GOST e Perfil Kollontai
# ==============================================================================

services:
  lacraia:
    build:
      context: .
      dockerfile: Dockerfile
    image: gambi.2lp.in/lumen/lacraia:latest
    container_name: lacraia
    user: "1000:1000"
    restart: unless-stopped
    ports:
      - "${PORT:-2011}:2011"
    environment:
      - PORT=2011
      - HOST=0.0.0.0
      - LACRAIA_MASTER_KEY=${LACRAIA_MASTER_KEY:-2011}
      - LASTFM_API_KEY=${LASTFM_API_KEY:-}
      - LASTFM_SHARED_SECRET=${LASTFM_SHARED_SECRET:-}
      - LACRAIA_DB_PATH=/app/data/lacraia.sqlite
      - LACRAIA_CACHE_DIR=/app/cache
      - LACRAIA_SITE_DIR=/app/site
    volumes:
      - ./data:/app/data
      - ./cache:/app/cache
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:2011/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

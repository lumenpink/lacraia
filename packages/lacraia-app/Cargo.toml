[package]
name = "lacraia-app"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Automotive player and cockpit application for La Craia built with Dioxus (Linux Desktop & Web/PWA)"

[lib]
name = "lacraia_app"
path = "src/lib.rs"

[[bin]]
name = "lacraia-app"
path = "src/main.rs"

[features]
default = ["desktop"]
desktop = [
    "dioxus/desktop",
    "dep:lacraia-core",
    "dep:tokio",
    "dep:reqwest",
    "dep:axum",
]
web = [
    "dioxus/web",
    "dep:web-sys",
    "dep:wasm-bindgen",
    "dep:wasm-bindgen-futures",
]

[dependencies]
lacraia-shared = { path = "../lacraia-shared" }
lacraia-core = { path = "../lacraia-core", optional = true }
tokio = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
axum = { version = "0.7", optional = true }
dioxus = { version = "0.6" }
dioxus-logger = "0.5"
tracing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
web-sys = { version = "0.3", optional = true, features = [
    "HtmlAudioElement",
    "MediaMetadata",
    "MediaSession",
    "MediaSessionAction",
    "Navigator",
    "Window",
] }
wasm-bindgen = { version = "0.2", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }

[dev-dependencies]
tokio = { workspace = true }
tempfile = { workspace = true }
reqwest = { workspace = true }

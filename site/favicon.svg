<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <filter id="glow-veneno" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="1.5" flood-color="#d4ff00" flood-opacity="0.85"/>
    </filter>
    <filter id="glow-fucsia" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="1.5" flood-color="#ff0055" flood-opacity="0.75"/>
    </filter>
  </defs>

  <!-- BASE SHIELD / FERRO BATE-PEDRA -->
  <rect x="2" y="2" width="60" height="60" rx="12" fill="#151618" stroke="#42464e" stroke-width="2"/>
  <rect x="5" y="5" width="54" height="54" rx="9" fill="none" stroke="#2b1d14" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- ANTENAS ARTICULADAS (VENENO ELÉTRICO) -->
  <g filter="url(#glow-veneno)" stroke="#d4ff00" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Antena Esquerda -->
    <path d="M 28 32 C 24 20, 16 12, 8 7" />
    <circle cx="8" cy="7" r="1.5" fill="#d4ff00" stroke="none" />
    <!-- Antena Direita -->
    <path d="M 36 32 C 40 20, 48 12, 56 7" />
    <circle cx="56" cy="7" r="1.5" fill="#d4ff00" stroke="none" />
  </g>

  <!-- PINÇAS PEÇONHENTAS / FORCÍPULAS -->
  <g stroke="#ff0055" stroke-width="2" fill="none" stroke-linecap="round">
    <path d="M 22 46 C 18 52, 22 57, 27 55" />
    <path d="M 42 46 C 46 52, 42 57, 37 55" />
  </g>

  <!-- PLACA CEFÁLICA (CABEÇA DA LACRAIA) -->
  <rect x="20" y="28" width="24" height="20" rx="6" fill="#1f2126" stroke="#ff0055" stroke-width="2" filter="url(#glow-fucsia)"/>

  <!-- OCELOS SENSERIAIS (OLHOS FLUORESCENTES) -->
  <circle cx="26" cy="36" r="2.2" fill="#d4ff00" filter="url(#glow-veneno)"/>
  <circle cx="38" cy="36" r="2.2" fill="#d4ff00" filter="url(#glow-veneno)"/>

  <!-- FENESTRA CENTRAL DA QUITINA -->
  <line x1="32" y1="31" x2="32" y2="45" stroke="#42464e" stroke-width="1.5" stroke-dasharray="2,2"/>
</svg>
